<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess </title>
    <link rel="stylesheet" href="chess.css">
</head>

<body>
    <main class="game">
        <h1> Chess Game</h1>
        <p id="turnText">White's Turn</p>
        <p id="message"> Click a piece to select it.</p>

        <div id="board" class="board" aria-label="Chess Board"></div>
        <button id="resetButton">New Game </button>
        <p class="help"> Select a piece to move. Green squares are the possible move that you can play </p>
    </main>
    <script src="chess.js"></script>
</body>

</html>
