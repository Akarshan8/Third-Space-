<!DOCTYPE html>
<html>
<head>
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="rock_paper_scissor.css">
</head>
<body>
    <div class="game">
        <h1>Rock Paper Scissors</h1>
        <p>Choose rock, paper, or scissors.</p>

        <div class="score">
            <div>You: <span id="playerScore">0</span></div>
            <div>Computer: <span id="computerScore">0</span></div>
        </div>

        <div class="moves">
            <div>
                <p>Your move</p>
                <div class="hand" id="playerHand">?</div>
            </div>
            <div class="vs">vs</div>
            <div>
                <p>Computer move</p>
                <div class="hand" id="computerHand">?</div>
            </div>
        </div>

        <p id="result">Press Start Game to begin</p>
        <p id="message">Choose a move to play.</p>

        <div class="choices">
            <button class="choice" data-choice="rock" disabled>✊ Rock</button>
            <button class="choice" data-choice="paper" disabled>✋ Paper</button>
            <button class="choice" data-choice="scissors" disabled>✌️ Scissors</button>
        </div>

        <button id="startButton">Start Game</button>
        <button id="resetButton">Start Over</button>
    </div>

    <script src="rock_paper_scissor.js"></script>
</body>
</html>
